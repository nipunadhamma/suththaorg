<body>

  <div id="main-nav"></div>

  <div class="reader-layout">
    <aside id="sidebar" class="sidebar">
      <div class="tree-header">ත්‍රිපිටක ග්‍රන්ථ</div>
      <div id="tree-filters" class="tree-root-nodes"></div>
      <div id="tree" class="tree"></div>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <main class="reader-main">
      <div class="reader-toolbar">
        <div class="seg">
          <button id="btn-prev-tab" title="පෙර ටැබ්">◀</button>
          <button id="btn-next-tab" title="මීළඟ ටැබ්">▶</button>
        </div>
        <div class="seg">
          <button id="btn-prev-text" title="පෙර ග්‍රන්ථය">⏮</button>
          <button id="btn-next-text" title="මීළඟ ග්‍රන්ථය">⏭</button>
        </div>
        <button id="btn-columns" class="btn small" title="තීරු පෙරළන්න">පාළි + සිංහල</button>
        <span class="spacer"></span>
        <button id="btn-close-tab" class="btn small" title="ටැබ් වසන්න">✕</button>
        <button id="btn-settings" class="btn small" title="සැකසුම්">සැකසුම්</button>
      </div>

      <div id="tabs-strip" class="tabs-strip"></div>
      <div id="tabs-content"></div>
    </main>
  </div>

  <div id="fn-tooltip" class="fn-tooltip"></div>

  <aside id="inline-dict" class="inline-dict">
    <div class="idict-head">
      <input id="idict-input" class="idict-input" type="text" placeholder="ශබ්දකෝෂයේ සොයන්න…" autocomplete="off">
      <button data-idict-backspace class="icon-btn" title="අකුරක් අඩු කරන්න">⌫</button>
      <button data-idict-close class="icon-btn" title="වසන්න">✕</button>
    </div>
    <div id="idict-body" class="idict-body"></div>
  </aside>

  <div id="fts-panel" class="fts-panel">
    <div class="fts-head"><span id="fts-progress"></span><button data-fts-close title="වසන්න">✕</button></div>
    <div id="fts-results" class="fts-results"></div>
  </div>

  <div id="settings-backdrop" class="dialog-backdrop">
    <div id="settings-dialog" class="dialog">
      <div class="dialog-title">කියවීමේ සැකසුම්</div>
      <div class="settings-grid">
        <label>තද පසුබිම
          <input type="checkbox" data-setting="set-darkmode">
        </label>
        <label>තීරු
          <select data-setting="set-columns">
            <option value="3">පේළි අතර (පාළි-සිංහල)</option>
            <option value="2">පාළි + සිංහල (පිටු දෙක)</option>
            <option value="0">පාළි පමණි</option>
            <option value="1">සිංහල පමණි</option>
          </select>
        </label>
        <label>ග්‍රන්ථ ගස භාෂාව
          <select data-setting="set-tree-lang">
            <option value="pali">පාළි</option>
            <option value="sinh">සිංහල</option>
          </select>
        </label>
        <label>පාද සටහන්
          <select data-setting="set-footnote-method">
            <option value="click">ක්ලික් කිරීම</option>
            <option value="hover">මත තබාගැනීම</option>
            <option value="end-page">පිටු අවසානයේ</option>
            <option value="hidden">සඟවන්න</option>
          </select>
        </label>
        <label>බන්ධන අකුරු
          <input type="checkbox" data-setting="set-bandi">
        </label>
        <label>විශේෂ අකුරු (පාළි)
          <input type="checkbox" data-setting="set-special">
        </label>
        <label>පිටු අංක
          <input type="checkbox" data-setting="set-page-nums">
        </label>
        <label>අකුරු ප්‍රමාණය
          <select data-setting="set-font-size">
            <option value="-3">කුඩා</option>
            <option value="0">සාමාන්‍ය</option>
            <option value="2">මධ්‍යම</option>
            <option value="4">විශාල</option>
          </select>
        </label>
      </div>
      <div class="dialog-actions"><button class="btn primary" data-dialog-close>වසන්න</button></div>
    </div>
  </div>

  <div id="snackbar" class="snackbar"></div>
  <div id="boot" class="page-shell"><div class="banner">දත්ත පූරණය වෙමින්…</div></div>

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {})
